[package]
name = "kcode"
version = "0.1.0"
description = "Kcode: a fast, focused coding agent (TUI, multi-model, swarm coordination)"
edition = "2024"
autobins = false

[workspace]
members = [
    ".",
    "crates/kcode-agent-runtime",
    "crates/kcode-app-core",
    "crates/kcode-base",
    "crates/kcode-tui",
    "crates/kcode-build-meta",
    "crates/kcode-pdf",
    "crates/kcode-logging",
    "crates/kcode-background-types",
    "crates/kcode-compaction-core",
    "crates/kcode-config-types",
    "crates/kcode-command-risk",
    "crates/kcode-core",
    "crates/kcode-fuzzy",
    "crates/kcode-message-types",
    "crates/kcode-plan",
    "crates/kcode-swarm-core",
    "crates/kcode-protocol",
    "crates/kcode-session-types",
    "crates/kcode-storage",
    "crates/kcode-provider-metadata",
    "crates/kcode-provider-env",
    "crates/kcode-provider-core",
    "crates/kcode-schema-dialect",
    "crates/kcode-provider-bedrock",
    "crates/kcode-provider-anthropic",
    "crates/kcode-provider-antigravity",
    "crates/kcode-provider-copilot",
    "crates/kcode-provider-openrouter",
    "crates/kcode-provider-openai",
    "crates/kcode-provider-gemini",
    "crates/kcode-provider-gemini-runtime",
    "crates/kcode-provider-cursor-runtime",
    "crates/kcode-provider-antigravity-runtime",
    "crates/kcode-provider-copilot-runtime",
    "crates/kcode-provider-claude-cli-runtime",
    "crates/kcode-provider-openrouter-runtime",
    "crates/kcode-provider-anthropic-runtime",
    "crates/kcode-provider-openai-runtime",
    "crates/kcode-provider-grok-build-runtime",
    "crates/kcode-provider-doctor",
    "crates/kcode-tui-markdown",
    "crates/kcode-tui-messages",
    "crates/kcode-usage-types",
    "crates/kcode-tui-core",
    "crates/kcode-task-types",
    "crates/kcode-transport",
    "crates/kcode-tool-core",
    "crates/kcode-tui-account-picker",
    "crates/kcode-tui-render",
    "crates/kcode-tui-visual-debug",
    "crates/kcode-tui-session-picker",
    "crates/kcode-tui-style",
    "crates/kcode-tui-tool-display",
    "crates/kcode-tui-usage-overlay",
    "crates/kcode-terminal-launch",
    "crates/kcode-terminal-image",
    "crates/kcode-tui-workspace",
    "crates/kcode-render-core",
]

[lib]
name = "kcode"
path = "src/lib.rs"

[[bin]]
name = "kcode"
path = "src/main.rs"

[[bin]]
name = "test_api"
path = "src/bin/test_api.rs"

[[bin]]
name = "kcode-harness"
path = "src/bin/harness.rs"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# File operations

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }

# Embeddings (local inference) - behind feature flag (163 crates, slow to compile)

# OAuth
open = "5"               # Open URLs in browser
kcode-tui-style = { path = "crates/kcode-tui-style" }
kcode-tui-session-picker = { path = "crates/kcode-tui-session-picker", features = ["serde"] }

# Streaming
tokio-stream = "0.1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Markdown & syntax highlighting

# PDF parsing (behind feature flag)
kcode-build-meta = { path = "crates/kcode-build-meta" }
# Tiny leaf helpers (console/env/fs/id) used directly by the cli layer.
# Presentation layer: the terminal UI (`tui`) + offline replay (`video_export`),
# compiled as a separate rustc unit. It re-exports the application core
# (`kcode-app-core`, which re-exports `kcode-base`), so the root crate (cli +
# bin) re-exports everything via `pub use kcode_tui::*`. default-features=false
# so the root feature set fully controls the downstream features (see
# [features]).
kcode-tui = { path = "crates/kcode-tui", default-features = false }
# `kcode provider-doctor` / provider diagnostics; sits downstream of kcode-base
# so doctor edits do not rebuild the base -> app-core -> tui spine.
kcode-provider-doctor = { path = "crates/kcode-provider-doctor" }
# Gemini provider runtime; sits downstream of kcode-base so gemini edits do
# not rebuild the base -> app-core -> tui spine. Registered with the external
# provider registry at startup (src/cli/startup.rs).
kcode-provider-gemini-runtime = { path = "crates/kcode-provider-gemini-runtime" }
kcode-provider-cursor-runtime = { path = "crates/kcode-provider-cursor-runtime" }
kcode-provider-antigravity-runtime = { path = "crates/kcode-provider-antigravity-runtime" }
kcode-provider-copilot-runtime = { path = "crates/kcode-provider-copilot-runtime" }
kcode-provider-claude-cli-runtime = { path = "crates/kcode-provider-claude-cli-runtime" }
kcode-provider-openrouter-runtime = { path = "crates/kcode-provider-openrouter-runtime" }
kcode-provider-anthropic-runtime = { path = "crates/kcode-provider-anthropic-runtime" }
kcode-provider-openai-runtime = { path = "crates/kcode-provider-openai-runtime" }
kcode-provider-grok-build-runtime = { path = "crates/kcode-provider-grok-build-runtime" }

# Archive extraction (for auto-update)
tempfile = "3"

[features]
# Use `KCODE_DEV_FEATURE_PROFILE=minimal` for compile-speed probes that need
# to skip optional default feature stacks.
default = ["pdf", "bedrock"]
# Live AWS Bedrock support (the AWS SDK stack) lives in kcode-provider-bedrock;
# forwards down through kcode-tui -> kcode-app-core -> kcode-base.
bedrock = ["kcode-tui/bedrock"]
# Internal release feature: build a supported OpenSSL inside the CentOS 7
# compatibility image while preserving the glibc 2.17 runtime baseline.
linux-compat-vendored-openssl = ["kcode-tui/linux-compat-vendored-openssl"]
pdf = ["kcode-tui/pdf"]


[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSThread",
    "NSRunLoop",
    "NSDate",
    "NSTimer",
    "NSUserDefaults",
    "NSValue",
    "NSAttributedString",
    "NSDictionary",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance",
    "NSApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSAttributedString",
    "NSMenu",
    "NSMenuItem",
    "NSRunningApplication",
] }
objc2-user-notifications = "0.3"

[profile.release]
opt-level = 1
debug = 0
codegen-units = 256
incremental = true

[profile.selfdev]
inherits = "release"
opt-level = 0

# Full LTO release for stable/distribution builds
[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = false

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 0

# The fuzzy matcher runs a char-level DP over every picker entry on every
# keystroke (e.g. /model search across hundreds of routes). It is small, pure,
# dependency-free code that rarely changes,
# so keeping it fully optimized in dev/selfdev builds costs one compile and
# removes visible input lag in unoptimized builds.
[profile.dev.package."kcode-fuzzy"]
opt-level = 3

[profile.selfdev.package."kcode-fuzzy"]
opt-level = 3

[profile.test.package."kcode-fuzzy"]
opt-level = 3

[profile.release.package."kcode-fuzzy"]
opt-level = 3

# Keep the terminal render stack optimized even in dev/selfdev/test builds.
#
# Every TUI frame walks ratatui buffers cell-by-cell and re-measures visible
# text with unicode-width/unicode-segmentation. At opt-level = 0 those inner
# loops dominated live-client profiles (perf showed str_width, grapheme
# bsearch, and Buffer::index_of_opt as the top symbols) and pushed a routine
# full frame to ~12ms p50 / 21ms p95, which reads as input-line lag while
# streaming saturates the redraw loop. These are stable third-party crates
# that almost never recompile, so pinning them is a one-time compile cost
# (same rationale as kcode-fuzzy above).
[profile.dev.package.ratatui]
opt-level = 3
[profile.selfdev.package.ratatui]
opt-level = 3
[profile.test.package.ratatui]
opt-level = 3

[profile.dev.package.ratatui-core]
opt-level = 3
[profile.selfdev.package.ratatui-core]
opt-level = 3
[profile.test.package.ratatui-core]
opt-level = 3

[profile.dev.package.ratatui-widgets]
opt-level = 3
[profile.selfdev.package.ratatui-widgets]
opt-level = 3
[profile.test.package.ratatui-widgets]
opt-level = 3

[profile.dev.package.ratatui-crossterm]
opt-level = 3
[profile.selfdev.package.ratatui-crossterm]
opt-level = 3
[profile.test.package.ratatui-crossterm]
opt-level = 3

[profile.dev.package.crossterm]
opt-level = 3
[profile.selfdev.package.crossterm]
opt-level = 3
[profile.test.package.crossterm]
opt-level = 3

[profile.dev.package.unicode-width]
opt-level = 3
[profile.selfdev.package.unicode-width]
opt-level = 3
[profile.test.package.unicode-width]
opt-level = 3

[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.selfdev.package.unicode-segmentation]
opt-level = 3
[profile.test.package.unicode-segmentation]
opt-level = 3

[profile.dev.package.unicode-truncate]
opt-level = 3
[profile.selfdev.package.unicode-truncate]
opt-level = 3
[profile.test.package.unicode-truncate]
opt-level = 3

[profile.dev.package.compact_str]
opt-level = 3
[profile.selfdev.package.compact_str]
opt-level = 3
[profile.test.package.compact_str]
opt-level = 3

# Keep the PDF text-extraction stack optimized even in dev/selfdev/test builds.
#
# ttf-parser (pulled in by pdf-extract -> lopdf) does the font work for
# extracting text from attached PDFs. At opt-level = 0 that path is markedly
# slower, and this is a stable third-party crate that almost never recompiles,
# so pinning it to opt-level = 3 costs a one-time compile and is then reused
# across every iterative kcode rebuild (same rationale as kcode-fuzzy above). It
# does NOT slow down recompiles of kcode's own crates.
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.selfdev.package.ttf-parser]
opt-level = 3
[profile.test.package.ttf-parser]
opt-level = 3

# Keep the raster image pipeline optimized in dev/selfdev/test builds.
#
# Inline transcript images decode (png/zune-jpeg/fdeflate/miniz_oxide), resize
# (image), and base64-encode (kitty transmit) at draw time; at opt-level 0 a
# single screenshot costs 100-200ms per decode/resize, which reads as input
# lag. These are pure pixel crates with no kcode logic, so optimizing them
# does not hurt rebuild times for our own code.
[profile.dev.package.image]
opt-level = 3
[profile.selfdev.package.image]
opt-level = 3
[profile.test.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
[profile.selfdev.package.png]
opt-level = 3
[profile.test.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.selfdev.package.zune-jpeg]
opt-level = 3
[profile.test.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
[profile.selfdev.package.fdeflate]
opt-level = 3
[profile.test.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.selfdev.package.miniz_oxide]
opt-level = 3
[profile.test.package.miniz_oxide]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3
[profile.selfdev.package.base64]
opt-level = 3
[profile.test.package.base64]
opt-level = 3

# session_search scans multi-megabyte session files with memchr-based
# case-insensitive matching; keep the SIMD scanner optimized everywhere.
[profile.dev.package.memchr]
opt-level = 3
[profile.selfdev.package.memchr]
opt-level = 3
[profile.test.package.memchr]
opt-level = 3

[profile.test]
debug = 0
incremental = true
codegen-units = 256

[dev-dependencies]
async-stream = "0.3"
# Used by tests/context_window_matrix.rs to assert the shared context-window
# resolution invariants directly, without going through a live provider.
kcode-provider-core = { path = "crates/kcode-provider-core" }
# Enables the downstream test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests, the
# ExternalAuthReviewCandidate read accessors) for the root crate's own cli test
# target. Feature unification applies this only to test/bench/example builds,
# never to a normal `cargo build`/release binary.
kcode-tui = { path = "crates/kcode-tui", default-features = false, features = ["test-support"] }

[build-dependencies]
