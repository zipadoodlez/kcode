[package]
name = "kcode-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
kcode-schema-dialect = { path = "../kcode-schema-dialect" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
kcode-core = { path = "../kcode-core" }
kcode-logging = { path = "../kcode-logging" }
kcode-message-types = { path = "../kcode-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
