[package]
name = "kcode-tui-markdown"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kcode-message-types = { path = "../kcode-message-types" }
kcode-render-core = { path = "../kcode-render-core" }
kcode-tui-style = { path = "../kcode-tui-style" }
kcode-tui-workspace = { path = "../kcode-tui-workspace" }
pulldown-cmark = "0.12"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
unicode-width = "0.2"

[features]
