[package]
name = "kcode-provider-openai-runtime"
version = "0.1.0"
edition = "2024"
description = "OpenAI provider runtime (Codex OAuth + API key, Responses API over SSE/WebSocket) for kcode, kept downstream of kcode-base so provider edits do not rebuild the app spine"

[lib]
name = "kcode_provider_openai_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
# default-features = false: the top-level binary decides heavy optional base
# features (bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets that cannot
# build tract-linalg's asm break.
kcode-base = { path = "../kcode-base", default-features = false }
kcode-message-types = { path = "../kcode-message-types" }
kcode-provider-core = { path = "../kcode-provider-core" }
kcode-schema-dialect = { path = "../kcode-schema-dialect" }
kcode-provider-openai = { path = "../kcode-provider-openai" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util", "process"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
dirs = "5"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# The migrated openai tests use kcode-base's test-env sandbox.
kcode-base = { path = "../kcode-base", default-features = false, features = ["test-support"] }
tempfile = "3"
