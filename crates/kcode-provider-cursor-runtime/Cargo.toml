[package]
name = "kcode-provider-cursor-runtime"
version = "0.1.0"
edition = "2024"
description = "Cursor provider runtime (direct ChatService streaming) for kcode, kept downstream of kcode-base so provider edits do not rebuild the app spine"

[lib]
name = "kcode_provider_cursor_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
h2 = "0.4"
http = "1"
# default-features = false: the top-level binary decides heavy optional base
# features (bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets that cannot
# build tract-linalg's asm break.
kcode-base = { path = "../kcode-base", default-features = false }
kcode-message-types = { path = "../kcode-message-types" }
kcode-provider-core = { path = "../kcode-provider-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
webpki-roots = "1"

[dev-dependencies]
# The migrated cursor tests use kcode-base's test-env sandbox (lock_test_env).
kcode-base = { path = "../kcode-base", default-features = false, features = ["test-support"] }
tempfile = "3"
