[package]
name = "kcode-provider-claude-cli-runtime"
version = "0.1.0"
edition = "2024"
description = "Deprecated Claude CLI provider runtime (subprocess transport) for kcode, kept downstream of kcode-base so provider edits do not rebuild the app spine"

[lib]
name = "kcode_provider_claude_cli_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
# default-features = false: the top-level binary decides heavy optional base
# features (bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets that cannot
# build tract-linalg's asm break.
kcode-base = { path = "../kcode-base", default-features = false }
kcode-message-types = { path = "../kcode-message-types" }
kcode-provider-core = { path = "../kcode-provider-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util"] }
tokio-stream = "0.1"
