[package]
name = "kcode-render-core"
version = "0.1.0"
edition = "2024"
publish = false

# Backend-neutral LaTeX math for the markdown renderer: a pure TeX-body to
# Unicode converter, plus the delimiter normalization that turns the spellings
# pulldown-cmark misses (`\(...\)`, `\[...\]`, environments, fenced math) into
# its `$`/`$$` form. No ratatui, no document model, no backend palette.

[dependencies]
unicode-width = "0.2"
