[package]
name = "kcode-provider-gemini-runtime"
version = "0.1.0"
edition = "2024"
description = "Gemini provider runtime (Code Assist OAuth + Developer API key) for kcode, kept downstream of kcode-base so provider edits do not rebuild the app spine"

[lib]
name = "kcode_provider_gemini_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# default-features = false: the top-level binary decides heavy optional base
# features (bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets that cannot
# build tract-linalg's asm break.
kcode-base = { path = "../kcode-base", default-features = false }
kcode-message-types = { path = "../kcode-message-types" }
kcode-provider-core = { path = "../kcode-provider-core" }
kcode-provider-gemini = { path = "../kcode-provider-gemini" }
kcode-schema-dialect = { path = "../kcode-schema-dialect" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
kcode-provider-antigravity = { path = "../kcode-provider-antigravity" }
kcode-provider-anthropic = { path = "../kcode-provider-anthropic" }
kcode-provider-openai = { path = "../kcode-provider-openai" }
kcode-provider-openrouter = { path = "../kcode-provider-openrouter" }
serde = { version = "1", features = ["derive"] }
# The migrated gemini tests use kcode-base's test-env sandbox (lock_test_env).
kcode-base = { path = "../kcode-base", default-features = false, features = ["test-support"] }
tempfile = "3"
