[package]
name = "kcode-provider-doctor"
version = "0.1.0"
edition = "2024"
publish = false

# Provider diagnostics that sit downstream of kcode-base: the strict
# `kcode provider-doctor` end-to-end runner (provider_e2e), the live provider
# probes it drives, and the auth-lifecycle contract driver. Split out of
# kcode-base so edits to the doctor cluster no longer rebuild the
# base -> app-core -> tui spine, and base compiles faster with lower peak
# memory.

[lib]
name = "kcode_provider_doctor"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# default-features = false: the doctor only needs base's always-on surface
# (auth, provider runtimes, provider_catalog, live_tests). Feature unification
# in the root binary re-enables bedrock there.
kcode-base = { path = "../kcode-base", default-features = false }
kcode-provider-gemini-runtime = { path = "../kcode-provider-gemini-runtime" }
kcode-provider-anthropic-runtime = { path = "../kcode-provider-anthropic-runtime" }
kcode-provider-openai-runtime = { path = "../kcode-provider-openai-runtime" }
kcode-provider-openrouter-runtime = { path = "../kcode-provider-openrouter-runtime" }
kcode-provider-cursor-runtime = { path = "../kcode-provider-cursor-runtime" }
kcode-provider-antigravity-runtime = { path = "../kcode-provider-antigravity-runtime" }
kcode-provider-copilot-runtime = { path = "../kcode-provider-copilot-runtime" }

[dev-dependencies]
# The auth-lifecycle driver tests run inside kcode-base's auth test sandbox.
kcode-base = { path = "../kcode-base", default-features = false, features = ["test-support"] }
kcode-provider-metadata = { path = "../kcode-provider-metadata" }
tokio = { version = "1", features = ["macros", "rt"] }
